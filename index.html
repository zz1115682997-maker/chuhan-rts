<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>楚汉 · 即时战略</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #000;
        color: #ece2cd; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      #game { position: fixed; inset: 0; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #hud > * { pointer-events: auto; }

      .topbar {
        position: absolute; left: 14px; top: 12px; display: flex; gap: 16px; align-items: center;
        background: linear-gradient(180deg, #241c14 0%, #141816 100%);
        padding: 8px 18px; border: 1px solid #8a7040; border-radius: 2px;
        box-shadow: 0 0 0 1px #2a2114, inset 0 1px 0 rgba(232,196,106,.28);
        font-size: 15px;
      }
      .faction { color: #e8c46a; font-weight: 700; letter-spacing: 5px; }
      .credits { color: #cfe8b5; min-width: 120px; }
      .timer { color: #8fa08f; font-variant-numeric: tabular-nums; }
      .opbtn {
        background: linear-gradient(180deg, #2a3328, #161c18); border: 1px solid #5c6b52;
        color: #e6dcc4; border-radius: 2px;
        padding: 3px 10px; font-size: 12px; font-family: inherit; cursor: pointer;
      }
      .opbtn:hover { border-color: #e8c46a; }

      .right {
        position: absolute; right: 10px; top: 10px; width: 208px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .mmwrap {
        background: linear-gradient(180deg, #241c14, #121614);
        border: 1px solid #8a7040; border-radius: 2px; padding: 6px;
        box-shadow: 0 0 0 1px #2a2114;
      }
      .minimap { display: block; width: 176px; height: 176px; cursor: crosshair; border-radius: 3px; margin: 0 auto; }

      /* 右侧栏：小地图下面的建造面板（红警式侧栏） */
      .panel {
        background:
          linear-gradient(180deg, rgba(232,196,106,.14), transparent 12px),
          linear-gradient(180deg, #221c16 0%, #151a17 60%, #0e1210 100%);
        border: 1px solid #a68448; border-radius: 2px;
        box-shadow: 0 0 0 1px #2a2114, 0 12px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,236,190,.26);
        padding: 6px 5px 8px;
        max-height: calc(100vh - 300px);
        overflow-y: auto; overflow-x: hidden;
      }
      .panel::-webkit-scrollbar { width: 6px; }
      .panel::-webkit-scrollbar-thumb { background: #6a6248; border-radius: 3px; }
      .tabs { display: flex; gap: 3px; margin-bottom: 6px; }
      .tab {
        flex: 1; background: linear-gradient(180deg, #2a3026, #171c17); border: 1px solid #6a6248;
        color: #b3aa90; font-size: 11px; letter-spacing: 2px; padding: 4px 0;
        cursor: pointer; border-radius: 2px; font-family: inherit;
        transition: border-color .12s, color .12s;
      }
      .tab:hover { border-color: #a68448; }
      .tab.active {
        border-color: #e8c46a; color: #f6e7be;
        background: linear-gradient(180deg, #4a3c1c, #2a2414);
        box-shadow: inset 0 0 10px rgba(232,196,106,.2);
      }
      .pane { display: none; }
      .pane.active { display: block; }
      .panel .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
      .actions {
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
        margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(166,132,72,.3);
      }
      .actions .btn { min-height: 36px; justify-content: center; padding: 2px 3px; font-size: 11px; }
      .actions .btn .ico { width: 22px; height: 22px; }
      .actions .btn .nm { font-size: 11px; letter-spacing: 1px; }
      .panel .btn { min-width: 0; min-height: 44px; padding: 3px 5px; gap: 5px; font-size: 12px; }
      .panel .btn .ico { width: 30px; height: 30px; }
      .panel .btn .nm { font-size: 12px; letter-spacing: .5px; line-height: 1.1; }
      .panel .btn .cost { font-size: 10px; }
      .queues { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
      .qrow {
        display: flex; align-items: center; gap: 6px;
        background: rgba(18,16,12,.9); border: 1px solid rgba(138,112,64,.35);
        padding: 3px 6px; border-radius: 2px;
      }
      .qname { width: 58px; color: #d8cbb0; overflow: hidden; white-space: nowrap; }
      .qbar { flex: 1; height: 6px; background: #243024; border-radius: 3px; overflow: hidden; }
      .qbar i { display: block; height: 100%; background: #c8a24a; transition: width .1s linear; }
      .qx { background: none; border: none; color: #7d8f7d; cursor: pointer; font-size: 15px; padding: 0 2px; }
      .qready {
        background: rgba(200,162,74,.18); border: 1px solid #c8a24a; padding: 5px 8px;
        border-radius: 4px; cursor: pointer; color: #f0d9a0;
      }

      .bottom {
        position: absolute; left: 14px; bottom: 14px; display: flex; align-items: stretch;
        flex-wrap: wrap; max-width: calc(100vw - 250px);
        background:
          linear-gradient(180deg, rgba(232,196,106,.16), transparent 14px),
          linear-gradient(180deg, #221c16 0%, #141816 46%, #0e1210 100%);
        border: 1px solid #a68448; border-radius: 2px;
        box-shadow: 0 0 0 1px #2a2114, 0 16px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,236,190,.28);
        padding: 10px 8px 12px;
      }
      .col { padding: 0 12px; border-left: 1px solid rgba(166,132,72,.35); }
      .col:first-child { border-left: none; }
      .col h4 {
        margin: 0 0 8px; font-size: 12px; color: #e8c46a; font-weight: 700;
        letter-spacing: 4px; text-align: center;
        border-bottom: 1px solid rgba(232,196,106,.4); padding-bottom: 4px;
      }
      .btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
      .btn {
        display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 7px;
        min-width: 96px; min-height: 58px;
        background: linear-gradient(180deg, #34382c 0%, #1a201c 100%);
        border: 1px solid #6a6248; color: #f3ead6; border-radius: 2px;
        padding: 5px 9px 5px 6px; cursor: pointer; font-size: 14px; font-family: inherit;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
        transition: border-color .12s, transform .12s, background .12s;
      }
      .btn .ico {
        width: 40px; height: 40px; object-fit: contain; flex: none; display: block;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
      }
      .btn .txt { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
      .btn .nm { font-weight: 700; letter-spacing: 1px; line-height: 1.15; }
      .btn .cost { font-size: 11px; color: #e8c46a; letter-spacing: .5px; }
      .btn:hover:not(:disabled) {
        border-color: #e8c46a;
        background: linear-gradient(180deg, #4a4634 0%, #24281e 100%);
        transform: translateY(-1px);
      }
      .btn:disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.35); }
      .btn.place, .btn.ready {
        border-color: #e8c46a;
        background: linear-gradient(180deg, #4a3c1c, #2a2414);
        box-shadow: 0 0 0 1px rgba(232,196,106,.45), inset 0 0 12px rgba(232,196,106,.18);
      }
      .btn.special { border-color: #c45a3a; }
      .btn.special .nm { color: #ffd7b0; }
      .btn.sell { border-color: #8a5340; background: linear-gradient(180deg, #3a2420, #241816); }
      .col.grow { max-width: 280px; display: flex; align-items: flex-end; }
      .info {
        font-size: 13px; color: #e6dcc4; line-height: 1.65; min-height: 58px;
        padding: 4px 4px 0; 
      }
      .dim { color: #a89880; }

      .toast {
        position: absolute; left: 50%; top: 13%; transform: translate(-50%, -8px);
        background: rgba(10,14,10,.94); border: 1px solid #6d7f5f; padding: 8px 22px;
        border-radius: 20px; font-size: 14px; opacity: 0; transition: .2s; white-space: nowrap;
        pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      .overlay {
        position: absolute; inset: 0; background: rgba(4,6,4,.74);
        display: flex; align-items: center; justify-content: center;
      }
      .overlay.hidden { display: none; }
      .overlay .card {
        background: #141c15; border: 1px solid #6d7f5f; padding: 34px 56px;
        border-radius: 10px; text-align: center;
      }
      .overlay h2 { margin: 0 0 8px; font-size: 30px; letter-spacing: 8px; color: #e8c46a; }
      .overlay p { margin: 0 0 20px; color: #b9c7ad; }
      .overlay button {
        background: #2a3d2a; color: #ece2cd; border: 1px solid #7fa869; padding: 9px 28px;
        border-radius: 5px; cursor: pointer; font-size: 15px; font-family: inherit;
      }

      /* ---------- 开局界面 ---------- */
      #menu {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 38%, #17251b 0%, #070b08 72%);
        color: #ece2cd; transition: opacity .22s ease;
      }
      #menu.leaving { opacity: 0; pointer-events: none; }
      .menu-inner { width: min(1080px, 94vw); text-align: center; }
      .menu-title {
        font-size: 46px; letter-spacing: 16px; color: #e8c46a; font-weight: 700;
        text-shadow: 0 2px 24px rgba(232,196,106,.25);
      }
      .menu-sub { margin-top: 10px; color: #8fa08f; letter-spacing: 6px; font-size: 13px; }
      .menu-grid { display: flex; gap: 44px; margin-top: 34px; justify-content: center; align-items: flex-start; }
      .menu-sec { flex: 1; min-width: 0; }
      .menu-h { font-size: 13px; color: #8fa08f; letter-spacing: 4px; margin-bottom: 12px; }
      .menu-cards { display: flex; gap: 12px; justify-content: center; }
      .menu-cards.map-cards { flex-wrap: wrap; }
      .mcard {
        background: linear-gradient(180deg, rgba(30,42,32,.9), rgba(18,26,20,.95));
        border: 1px solid #3d513f; border-radius: 8px; padding: 14px 16px; cursor: pointer;
        transition: .15s; min-width: 132px;
      }
      .mcard:hover { border-color: #7fa869; transform: translateY(-2px); }
      .mcard.active {
        border-color: #e8c46a;
        box-shadow: 0 0 0 1px #e8c46a inset, 0 6px 22px rgba(232,196,106,.18);
        background: linear-gradient(180deg, rgba(58,48,24,.92), rgba(24,28,20,.95));
      }
      .mcard-title { font-size: 26px; letter-spacing: 6px; color: #ece2cd; }
      .mcard-title.small { font-size: 15px; letter-spacing: 3px; margin-top: 8px; }
      .mcard-tag { margin-top: 6px; font-size: 12px; color: #9db193; line-height: 1.5; max-width: 150px; }
      .mcard-units { margin-top: 8px; font-size: 11px; color: #c8a24a; }
      .thumb {
        display: block; width: 132px; height: 132px; border-radius: 4px;
        border: 1px solid #2c3a2d; image-rendering: pixelated;
      }
      .menu-hint { margin-top: 16px; font-size: 13px; color: #a9b8a0; line-height: 1.7; min-height: 46px; }
      .menu-start {
        margin-top: 30px; padding: 14px 64px; font-size: 19px; font-family: inherit; letter-spacing: 8px;
        color: #1a1408; background: linear-gradient(180deg, #f0d18a, #c8a24a); border: none;
        border-radius: 6px; cursor: pointer; font-weight: 700;
        box-shadow: 0 8px 26px rgba(200,162,74,.28);
      }
      .menu-start:hover { filter: brightness(1.08); }

      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0b0f0c; color: #8fa08f; font-size: 16px; z-index: 50; letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="boot">载入中…</div>
    <script type="importmap">
      { "imports": { "pixi.js": "/vendor/pixi.mjs" } }
    </script>
    <script type="module" src="/dist/src/main.js"></script>
  </body>
</html>
